# ============================================================
#  Aluguel de Carros - configuração principal
#  Banco padrão: Supabase (PostgreSQL). Configure as variáveis
#  de ambiente abaixo (veja backend/.env.example).
# ============================================================
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aluguel-carros
  config:
    # Permite manter as credenciais do Supabase em backend/.env (não versionado)
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo

app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-aluguel-carros-puc-minas}
    expiracao-horas: ${JWT_EXPIRACAO_HORAS:8}
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173}
  seed:
    enabled: ${APP_SEED_ENABLED:true}

logging:
  level:
    br.pucminas.aluguelcarros: INFO
